<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>予定編集</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header>
    <h1>予定編集</h1>
    <a class="add-button" href="/">戻る</a>
</header>

<main>

    <form class="form-box" method="POST">

        <label>予定名</label>
        <input
            type="text"
            name="title"
            value="{{ schedule['title'] }}"
            required
        >

        <label>開始日時</label>
        <input
            type="datetime-local"
            name="date"
            value="{{ schedule['date'] }}"
            required
        >

        <label>終了日時（任意）</label>
        <input
            type="datetime-local"
            name="end_date"
            value="{{ schedule['end_date'] or '' }}"
        >

        <p class="help-text">
            日をまたぐ予定の場合に入力してください。
        </p>

        <h2 class="form-title">通知設定</h2>

        <label>前日通知の時刻</label>
        <input
            type="time"
            name="notify_day_before"
            value="{{ schedule['notify_day_before'] or '' }}"
        >

        <label>何分前に通知するか</label>
        <input
            type="text"
            name="notify_minutes_before"
            value="{{ schedule['notify_minutes_before'] or '' }}"
            placeholder="例：120,60,30,10"
        >

        <p class="help-text">
            複数指定する場合はカンマで区切る。例：120,60,30,10
        </p>

        <label class="checkbox-label">
            <input
                type="checkbox"
                name="notify_at_time"
                {% if schedule['notify_at_time'] == 1 %}
                    checked
                {% endif %}
            >
            開始時刻にも通知する
        </label>

        <button type="submit">更新</button>

    </form>

    <form
        class="delete-form"
        method="POST"
        action="/delete/{{ schedule['id'] }}"
    >
        <button class="delete-button" type="submit">
            削除
        </button>
    </form>

</main>

</body>
</html>
